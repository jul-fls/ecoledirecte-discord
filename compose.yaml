services:
  notifier:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      STATE_FILE: /app/data/state.json
    volumes:
      - notifications:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 3m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  notifications:
