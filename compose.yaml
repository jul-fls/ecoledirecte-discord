services:
  notifier:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 3m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
